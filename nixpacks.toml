[phases.setup]
nixPkgs = [
  "tesseract",
  "python311",
  "gcc",
  "file",
  "python311Packages.pip",
]

[phases.install]
cmds = [
  "python3.11 -m pip install -r requirements.txt",
]

[phases.build]
cmds = [
  "python manage.py collectstatic --noinput",
]

[start]
cmd = "gunicorn assurex.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"

