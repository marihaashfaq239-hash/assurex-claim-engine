{% extends "base/base.html" %}
{% load static %}

{% block title %}Password Reset Complete — AssureX{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card text-center">

    <div class="mb-4">
      <div class="auth-logo mb-2">
        <i class="bi bi-shield-check"></i> AssureX
      </div>
    </div>

    <div class="mb-4">
      <div style="font-size:3.5rem; color:#198754;">
        <i class="bi bi-check-circle-fill"></i>
      </div>
      <h5 class="fw-bold mt-3">Password Reset Successful!</h5>
      <p class="text-muted small">
        Your password has been set. You can now sign in with your new password.
      </p>
    </div>

    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2 fw-semibold">
      <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
    </a>

  </div>
</div>
{% endblock %}
