<a href="{{ url }}"
   class="d-flex align-items-center gap-2 px-3 py-2 text-decoration-none rounded-2 mb-1 qa-item"
   style="color:#334155;font-size:.83rem;font-weight:500;transition:all .15s;border:1px solid transparent;">
  <div style="width:28px;height:28px;border-radius:.4rem;background:{{ accent }}18;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
    <i class="bi {{ icon }}" style="color:{{ accent }};font-size:.85rem;"></i>
  </div>
  <span class="flex-grow-1">{{ label }}</span>
  {% if badge %}
    <span class="badge rounded-pill" style="background:{{ accent }};font-size:.62rem;min-width:18px;">{{ badge }}</span>
  {% endif %}
  <i class="bi bi-chevron-right" style="font-size:.6rem;color:#94a3b8;"></i>
</a>
