<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>403 — Access Denied | AssureX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f4f6fa; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .error-card { text-align:center; max-width:480px; padding:3rem 2rem; background:#fff; border-radius:1rem; box-shadow:0 4px 20px rgba(0,0,0,.08); }
    .error-code { font-size:6rem; font-weight:700; color:#dc2626; line-height:1; }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">403</div>
    <h3 class="mt-2 fw-700">Access Denied</h3>
    <p class="text-muted mt-2">You don't have permission to view this page. If you think this is a mistake, contact your administrator.</p>
    <a href="javascript:history.back()" class="btn btn-outline-secondary me-2"><i class="bi bi-arrow-left me-1"></i>Go Back</a>
    <a href="/accounts/login/" class="btn btn-primary"><i class="bi bi-house me-1"></i>Home</a>
  </div>
</body>
</html>
