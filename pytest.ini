[pytest]
# AssureX Claim Engine — pytest configuration
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Django settings - only used when Django + all deps are installed
# Uncomment when running Django tests: DJANGO_SETTINGS_MODULE = assurex.settings.development

# Markers
markers =
    functional: Functional test cases
    boundary: Boundary/edge value test cases
    negative: Negative test cases
    security: Security test cases
    integration: Integration test cases
    database: Database test cases
    ocr: OCR extraction test cases
    model: ML model test cases
    rule_engine: Rule engine test cases

# Output verbosity
addopts = -v --tb=short

# Ignore deprecation warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
